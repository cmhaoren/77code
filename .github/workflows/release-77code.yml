name: Release 77 Code (Windows)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (for example 0.1.12). Defaults to apps/desktop/package.json."
        required: false
        type: string
      prerelease:
        description: "Publish as a GitHub prerelease (nightly channel)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-77code-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release_windows:
    name: Build & Publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $raw = "${{ inputs.version }}".Trim()
          if (-not $raw -and "${{ github.ref_type }}" -eq "tag") {
            $raw = "${{ github.ref_name }}".TrimStart("v")
          }
          if (-not $raw) {
            $pkg = Get-Content "apps/desktop/package.json" -Raw | ConvertFrom-Json
            $raw = "$($pkg.version)".Trim()
          }
          if ($raw -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') {
            throw "Invalid release version: $raw"
          }
          $isPrerelease = "${{ inputs.prerelease }}" -eq "true" -or $raw -match '-nightly\.'
          "version=$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved 77 Code release version: $raw (tag: v$raw, prerelease: $isPrerelease)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"
          cache: "pnpm"

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build Windows NSIS installer & update manifest
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          T3CODE_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_TELEMETRY_CHANNEL: dev
        run: |
          node scripts/build-desktop-artifact.ts `
            --platform win `
            --target nsis `
            --arch x64 `
            --build-version "${{ steps.version.outputs.version }}" `
            --output-dir "release-out"

      - name: Verify update artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem "release-out" -File
          $files | Select-Object Name, Length | Format-Table -AutoSize
          $exe = $files | Where-Object { $_.Extension -eq ".exe" }
          $yml = $files | Where-Object { $_.Extension -eq ".yml" }
          if (-not $exe) { throw "Missing .exe installer in release-out" }
          if (-not $yml) { throw "Missing electron-updater .yml manifest in release-out" }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $prerelease = "${{ steps.version.outputs.prerelease }}" -eq "true"
          $assets = Get-ChildItem "release-out" -File | Where-Object {
            $_.Extension -in @(".exe", ".blockmap", ".yml")
          } | ForEach-Object { $_.FullName }

          $exists = $true
          try {
            gh release view $tag --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -ne 0) { $exists = $false }
          } catch {
            $exists = $false
          }

          if ($exists) {
            gh release upload $tag @assets --clobber --repo "${{ github.repository }}"
          } else {
            $args = @(
              "release", "create", $tag,
              "--repo", "${{ github.repository }}",
              "--title", "77 Code $tag",
              "--generate-notes"
            )
            if ($prerelease) { $args += "--prerelease" }
            $args += $assets
            gh @args
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
